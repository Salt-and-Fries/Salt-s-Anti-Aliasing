plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            runDir "run/${project.minecraft_version}"
            if (project.hasProperty('dlssRuntimeDirectory')) {
                vmArg "-Dsalts.dlss.pluginPath=${project.file(project.property('dlssRuntimeDirectory')).absolutePath}"
            }
        }
    }

    mods {
        "salts_anti_aliasing" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    compileOnly "net.caffeinemc:sodium-fabric-api:${project.sodium_api_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }

    from("native/redist") {
        into "assets/${project.archives_base_name.replace('-', '_')}/native"
    }
    // Remove stale files produced by older bundled-runtime builds. NVIDIA's runtime is now
    // exclusively user supplied, including for runClient.
    doFirst {
        def previousBundle = destinationDir.toPath().resolve('assets/salts_anti_aliasing/native/dlss/windows-x86_64')
        ['bundle.properties', 'sl.interposer.dll', 'sl.common.dll', 'sl.dlss.dll',
         'nvngx_dlss.dll', 'NvLowLatencyVk.dll', 'LICENSE-NVIDIA-DLSS.txt',
         'NOTICE.txt', 'END-USER-TERMS.txt'].each { name ->
            java.nio.file.Files.deleteIfExists(previousBundle.resolve(name))
        }
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    // Defense against old generated resources or accidental SDK staging in redist.
    exclude '**/nvngx_*.dll', '**/sl.*.dll', '**/NvLowLatencyVk.dll',
            '**/native/dlss/**/bundle.properties'

    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// Public builds must never contain NVIDIA's user-downloaded executable runtime.
tasks.register('verifyPublicJar') {
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            def forbidden = names.findAll { name ->
                def file = name.tokenize('/').last()
                file ==~ /(?i)(nvngx_.*|sl\..*|NvLowLatencyVk)\.dll/
            }
            if (!forbidden.empty) throw new GradleException("NVIDIA runtime binaries cannot ship: ${forbidden}")
            if (!names.contains('assets/salts_anti_aliasing/native/dlss/windows-x86_64/salts_dlss_bridge.dll'))
                throw new GradleException("The mod's DLSS bridge is missing")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyPublicJar') }
