// Applied by Prism after each Fabric target is configured.
apply plugin: 'maven-publish'
group = rootProject.group

// Prism supplies older cross-loader Mixin helpers by default. Fabric Loader already
// supplies the matching Mixin/MixinExtras APIs; compiling against the older copies
// changes injector annotation signatures on 26.3.
['compileOnly', 'annotationProcessor'].each { configurationName ->
    configurations.named(configurationName) {
        withDependencies { dependencies ->
            dependencies.removeAll { dependency ->
                (dependency.group == 'org.spongepowered' && dependency.name == 'mixin') ||
                        (dependency.group == 'io.github.llamalad7' && dependency.name == 'mixinextras-common')
            }
        }
    }
}

loom {
    runs {
        client {
            // Keep existing development worlds, configs, and optional mods in place.
            runDir rootProject.file("run/${project.minecraft_version}").absolutePath
            if (project.hasProperty('sodiumProfile')) {
                runDir rootProject.file("run/${project.minecraft_version}/sodium-${project.property('sodiumProfile')}").absolutePath
                programArgs '--graphicsBackend', 'VULKAN'
            }
            if (project.hasProperty('dlssRuntimeDirectory')) {
                vmArg "-Dsalts.dlss.pluginPath=${rootProject.file(project.property('dlssRuntimeDirectory')).absolutePath}"
            }
        }
    }
    mods {
        "salts_anti_aliasing" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

if (project.minecraft_version in ['26.2', '26.3']) {
    fabricApi.configureTests {
        createSourceSet = true
        modId = 'salts_anti_aliasing_validation'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
    sourceSets.gametest.compileClasspath += sourceSets.client.output
    sourceSets.gametest.runtimeClasspath += sourceSets.client.output
    tasks.named('compileGametestJava') { dependsOn tasks.named('clientClasses') }
    loom.runs.named('clientGameTest') {
        def profileSuffix = project.hasProperty('sodiumProfile') ? "-sodium-${project.property('sodiumProfile')}" : ''
        runDir rootProject.file("run/${project.minecraft_version}/validation${profileSuffix}").absolutePath
        programArgs '--graphicsBackend', 'VULKAN', '--width', '1280', '--height', '720'
        if (project.hasProperty('dlssRuntimeDirectory'))
            vmArg "-Dsalts.dlss.pluginPath=${rootProject.file(project.property('dlssRuntimeDirectory')).absolutePath}"
    }
}

// Datagen uses compiled mod resources itself. Order the sources archive after it
// when both tasks are requested, without launching Minecraft on normal builds.
tasks.named('sourcesJar') { mustRunAfter tasks.named('runDatagen') }

dependencies {
    // Optional full renderer, deliberately absent from default runClient and public jars.
    if (project.hasProperty('sodiumProfile')) {
        def profile = project.property('sodiumProfile')
        if (!(profile in ['stable', 'beta'])) throw new GradleException('sodiumProfile must be stable or beta')
        runtimeOnly "maven.modrinth:sodium:${profile == 'stable' ? project.sodium_stable_runtime : project.sodium_beta_runtime}"
    }

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
    testImplementation "net.caffeinemc:sodium-fabric-api:${project.sodium_api_version}"
}

// Client adapters are tested with real off-heap vertex buffers without launching the game.
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output
tasks.named('compileTestJava') { dependsOn tasks.named('clientClasses') }

if (project.hasProperty('sodiumProfile')) {
    tasks.register('verifySodiumRuntime') {
        doLast {
            def profile = project.property('sodiumProfile')
            def expected = profile == 'stable' ? project.sodium_stable_sha256 : project.sodium_beta_sha256
            def artifact = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
                it.moduleVersion.id.group == 'maven.modrinth' && it.name == 'sodium'
            }
            if (artifact == null) throw new GradleException('The full Sodium runtime is missing')
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
            if (actual != expected) throw new GradleException("Unexpected Sodium runtime checksum: ${actual}")
            logger.lifecycle("Verified Sodium ${profile} runtime SHA-256 ${actual}")
        }
    }
    tasks.named('runClient') { dependsOn tasks.named('verifySodiumRuntime') }
    tasks.matching { it.name == 'runClientGameTest' }.configureEach {
        dependsOn tasks.named('verifySodiumRuntime')
    }
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

processResources {
    filteringCharset "UTF-8"

    from(rootProject.file("native/redist")) {
        into "assets/${project.archives_base_name.replace('-', '_')}/native"
    }
    // Remove stale files produced by older bundled-runtime builds. NVIDIA's runtime is now
    // exclusively user supplied, including for runClient.
    doFirst {
        def previousBundle = destinationDir.toPath().resolve('assets/salts_anti_aliasing/native/dlss/windows-x86_64')
        ['bundle.properties', 'sl.interposer.dll', 'sl.common.dll', 'sl.dlss.dll',
         'nvngx_dlss.dll', 'NvLowLatencyVk.dll', 'LICENSE-NVIDIA-DLSS.txt',
         'NOTICE.txt', 'END-USER-TERMS.txt'].each { name ->
            java.nio.file.Files.deleteIfExists(previousBundle.resolve(name))
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    // Prism pins the Java 25 toolchain and release level.
    it.options.encoding = "UTF-8"
}

jar {
    // Defense against old generated resources or accidental SDK staging in redist.
    exclude '**/nvngx_*.dll', '**/sl.*.dll', '**/NvLowLatencyVk.dll',
            '**/native/dlss/**/bundle.properties'
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}-mc${project.minecraft_version}"
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// Public builds must never contain NVIDIA's user-downloaded executable runtime.
tasks.register('verifyPublicJar') {
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            def readJson = { name ->
                def entry = zip.getEntry(name)
                if (entry == null) throw new GradleException("Missing mod metadata: ${name}")
                zip.getInputStream(entry).withCloseable { new groovy.json.JsonSlurper().parse(it) }
            }
            def metadata = readJson('fabric.mod.json')
            if (metadata.id != 'salts_anti_aliasing' || metadata.environment != 'client'
                    || metadata.depends.minecraft != project.minecraft_version)
                throw new GradleException("The public jar must target the ${project.minecraft_version} Fabric client")
            if (names.any { it.startsWith('org/betterLostItems/salts_anti_aliasing/validation/') })
                throw new GradleException('GPU validation code must remain outside the public jar')
            metadata.entrypoints.values().flatten().each { entrypoint ->
                if (!names.contains(entrypoint.replace('.', '/') + '.class'))
                    throw new GradleException("Missing Fabric entrypoint: ${entrypoint}")
            }
            metadata.mixins.each { registration ->
                def configName = registration instanceof String ? registration : registration.config
                def mixins = readJson(configName)
                ((mixins.mixins ?: []) + (mixins.client ?: [])).each { mixin ->
                    if (!names.contains((mixins.package + '.' + mixin).replace('.', '/') + '.class'))
                        throw new GradleException("Missing registered mixin: ${mixin}")
                }
            }
            def forbidden = names.findAll { name ->
                def file = name.tokenize('/').last()
                file ==~ /(?i)(nvngx_.*|sl\..*|NvLowLatencyVk)\.dll/
            }
            if (!forbidden.empty) throw new GradleException("NVIDIA runtime binaries cannot ship: ${forbidden}")
            if (names.any { it.startsWith('net/caffeinemc/') || it ==~ /.*sodium.*\.jar/ })
                throw new GradleException('Sodium must remain an optional external mod')
            if (!names.contains('assets/salts_anti_aliasing/native/dlss/windows-x86_64/salts_dlss_bridge.dll'))
                throw new GradleException("The mod's DLSS bridge is missing")
            def sgsrRoot = 'assets/salts_anti_aliasing/'
            ['sgsr1_standard', 'sgsr1_edge', 'sgsr2_convert', 'sgsr2_upscale',
             'sgsr2_entity_motion', 'sgsr2_particle_motion'].each { shader ->
                if (!names.contains(sgsrRoot + 'shaders/post/' + shader + '.fsh'))
                    throw new GradleException("Missing SGSR shader: ${shader}")
            }
            ['LICENSE-SGSR.txt', 'source-manifest.json'].each { file ->
                if (!names.contains(sgsrRoot + 'licenses/sgsr/' + file))
                    throw new GradleException("Missing SGSR provenance: ${file}")
            }
            def xessRoot = 'assets/salts_anti_aliasing/native/xess/windows-x86_64/'
            def xessManifest = new Properties()
            def manifestEntry = zip.getEntry(xessRoot + 'bundle.properties')
            if (manifestEntry == null) throw new GradleException('The XeSS runtime manifest is missing')
            zip.getInputStream(manifestEntry).withCloseable { xessManifest.load(it) }
            ['salts_xess_bridge.dll', 'libxess.dll', 'LICENSE-Intel-XeSS.txt', 'third-party-programs.txt'].each { file ->
                def entry = zip.getEntry(xessRoot + file)
                if (entry == null) throw new GradleException("Missing XeSS bundle file: ${file}")
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                zip.getInputStream(entry).withCloseable { input ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
                if (digest.digest().encodeHex().toString() != xessManifest.getProperty(file + '.sha256'))
                    throw new GradleException("XeSS bundle checksum mismatch: ${file}")
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyPublicJar') }

apply from: rootProject.file('gradle/fabric-production-validation.gradle')
